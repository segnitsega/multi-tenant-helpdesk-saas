name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay
      DATABASE_URL_SYSTEM: postgresql://postgres:postgres@localhost:5432/relay
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      MAIL_DOMAIN: mail.localhost
      MAIL_FROM_NAME: Relay
      SMTP_URL: smtp://localhost:1025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: relay-ci
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E placeholder
        run: echo "Configure E2E_USER_EMAIL / E2E_USER_PASSWORD secrets to enable full e2e."

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy note
        run: echo "Wire Fly/Railway deploy tokens here after the first production release."
